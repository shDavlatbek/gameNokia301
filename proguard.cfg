# ProGuard configuration for the Vanguard Zero MIDlet.
# -microedition makes ProGuard preverify for CLDC (StackMap attributes),
# -target 1.3 writes class files the Series 40 class loader accepts (major 47).
-injars      build/vz-raw.jar
-outjars     dist/VanguardZero.jar
-libraryjars build/cldc-stubs.jar
-libraryjars lib/microemu-midp-2.0.4.jar

-microedition
-target 1.3
-optimizationpasses 3
-allowaccessmodification
-repackageclasses ''
-dontusemixedcaseclassnames
-printmapping build/mapping.txt

-keep public class vz.Main {
    public *;
}
